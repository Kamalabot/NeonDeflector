<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Neon Deflector</title>
  <script src="https://game-cdn.poki.com/scripts/v2/poki-sdk.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #050608; font-family: monospace; display: flex; align-items: center; justify-content: center; }
    #canvas-container { position: relative; width: 100vw; height: 100vh; max-width: 177.78vh; max-height: 56.25vw; box-shadow: 0 0 20px rgba(0,0,0,0.8); cursor: crosshair; }
    canvas { width: 100%; height: 100%; display: block; background: #0b0c10; }
    #ui { position: absolute; inset: 0; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 20px; z-index: 10; }
    .hud-bar { display: flex; justify-content: space-between; align-items: center; width: 100%; }
    .hud { font-size: 22px; color: #66fcf1; font-weight: bold; text-shadow: 0 0 8px rgba(102,252,241,0.6); }
    .hud-peers { font-size: 16px; color: #bd93f9; text-shadow: 0 0 8px rgba(189,147,249,0.6); }
    
    #overlay { 
      position: absolute; 
      inset: 0; 
      background: rgba(11,12,16,0.88); 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      justify-content: center; 
      z-index: 20; 
      pointer-events: auto;
    }
    h1 { color: #66fcf1; font-size: 42px; margin-bottom: 12px; text-shadow: 0 0 16px #66fcf1; letter-spacing: 3px; }
    p { color: #c5c6c7; font-size: 16px; margin-bottom: 28px; text-align: center; line-height: 1.6; }
    
    #actionBtn { 
      background: #45a29e; 
      color: #0b0c10; 
      border: 2px solid #66fcf1; 
      padding: 16px 36px; 
      font-size: 22px; 
      font-weight: bold; 
      border-radius: 4px; 
      cursor: pointer; 
      transition: all 0.2s ease;
      box-shadow: 0 0 15px rgba(102,252,241,0.4);
    }
    #actionBtn:hover { 
      background: #66fcf1; 
      box-shadow: 0 0 25px #66fcf1; 
      transform: scale(1.05);
    }

    #leaderboardOverlay {
      position: absolute;
      inset: 0;
      background: rgba(11, 12, 16, 0.95);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #c5c6c7;
      font-family: monospace;
      z-index: 30;
      padding: 20px;
      pointer-events: auto;
    }
    .lb-title {
      color: #66fcf1;
      font-size: 28px;
      margin-bottom: 12px;
      letter-spacing: 2px;
      text-shadow: 0 0 10px rgba(102, 252, 241, 0.5);
    }
    .lb-form {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
      width: 100%;
      max-width: 380px;
    }
    .lb-input {
      flex: 1;
      background: #1f2833;
      border: 1px solid #45a29e;
      color: #fff;
      padding: 8px 12px;
      font-family: monospace;
      font-size: 16px;
      border-radius: 4px;
      outline: none;
    }
    .lb-input:focus { border-color: #66fcf1; }
    .lb-btn {
      background: #45a29e;
      color: #0b0c10;
      border: none;
      padding: 8px 16px;
      font-weight: bold;
      cursor: pointer;
      border-radius: 4px;
      font-size: 14px;
      transition: background 0.2s;
    }
    .lb-btn:hover { background: #66fcf1; }
    .lb-btn:disabled { background: #333; color: #777; cursor: not-allowed; }
    .lb-table-wrap {
      width: 100%;
      max-width: 380px;
      max-height: 240px;
      overflow-y: auto;
      border: 1px solid #1f2833;
      border-radius: 4px;
      background: #0b0c10;
    }
    .lb-table { width: 100%; border-collapse: collapse; font-size: 14px; }
    .lb-table th { background: #1f2833; color: #66fcf1; text-align: left; padding: 8px; }
    .lb-table td { padding: 6px 8px; border-bottom: 1px solid #1f2833; }
    .lb-table tr:first-child td { color: #ffd700; font-weight: bold; }
    .lb-status { font-size: 12px; height: 18px; margin-top: 6px; color: #ff4d4d; }
    .lb-close-btn { margin-top: 14px; background: transparent; border: 1px solid #c5c6c7; color: #c5c6c7; }
    .lb-close-btn:hover { background: #1f2833; color: #fff; }
  </style>
</head>
<body>
  <div id="canvas-container">
    <canvas id="gameCanvas" width="960" height="540"></canvas>
    
    <div id="ui">
      <div class="hud-bar">
        <div class="hud" id="scoreDisplay">SCORE: 0</div>
        <div class="hud-peers" id="peerDisplay">ONLINE: 1</div>
      </div>
    </div>
    
    <div id="overlay">
      <h1 id="overlayTitle">NEON DEFLECTOR</h1>
      <p id="overlayDesc">Move mouse/touch horizontally to guide the magnetic collector.<br>Droplets are pulled in when near.</p>
      <button id="actionBtn" type="button">START MISSION</button>
    </div>

    <div id="leaderboardOverlay">
      <div class="lb-title">HALL OF FAME</div>
      <div class="lb-form" id="submitScoreSection">
        <input type="text" id="playerNameInput" class="lb-input" maxlength="20" placeholder="ENTER CALLSIGN">
        <button id="submitScoreBtn" class="lb-btn" type="button">SUBMIT</button>
      </div>
      <div class="lb-table-wrap">
        <table class="lb-table">
          <thead>
            <tr>
              <th style="width: 15%;">#</th>
              <th style="width: 55%;">PILOT</th>
              <th style="width: 30%; text-align: right;">SCORE</th>
            </tr>
          </thead>
          <tbody id="leaderboardBody">
            <tr><td colspan="3" style="text-align:center;">No records yet</td></tr>
          </tbody>
        </table>
      </div>
      <div class="lb-status" id="lbStatusMessage"></div>
      <button id="closeLeaderboardBtn" class="lb-btn lb-close-btn" type="button">RETRY</button>
    </div>
  </div>

  <script>
    const API_BASE_URL = "https://leaderboard-api.kamaljp.workers.dev";

    let sdkReady = false;
    let audioCtx = null;
    let isMuted = false;

    if (typeof PokiSDK !== 'undefined') {
      PokiSDK.init().then(() => {
        sdkReady = true;
        try { PokiSDK.gameLoadingFinished(); } catch(e) {}
      }).catch(() => {
        sdkReady = false;
      });
    }

    function initAudio() {
      try {
        if (!audioCtx) {
          const AudioClass = window.AudioContext || window.webkitAudioContext;
          if (AudioClass) audioCtx = new AudioClass();
        }
        if (audioCtx && audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
      } catch (e) {}
    }

    function playBeep(freq, type, duration) {
      if (!audioCtx || isMuted) return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const overlay = document.getElementById('overlay');
    const overlayTitle = document.getElementById('overlayTitle');
    const overlayDesc = document.getElementById('overlayDesc');
    const actionBtn = document.getElementById('actionBtn');
    const scoreDisplay = document.getElementById('scoreDisplay');
    const peerDisplay = document.getElementById('peerDisplay');

    const lbOverlay = document.getElementById("leaderboardOverlay");
    const lbBody = document.getElementById("leaderboardBody");
    const lbStatus = document.getElementById("lbStatusMessage");
    const nameInput = document.getElementById("playerNameInput");
    const submitBtn = document.getElementById("submitScoreBtn");
    const closeBtn = document.getElementById("closeLeaderboardBtn");
    const submitSection = document.getElementById("submitScoreSection");

    let state = 'MENU';
    let score = 0;
    // Widened collector paddle with instant tracking
    let player = { x: 420, y: 480, w: 120, h: 16 };
    let projectiles = [];
    let spawnTimer = 0;
    let lastGameScore = 0;
    let backgroundOffset = 0;
    let pulseGlow = 0;

    let socket = null;
    let selfPlayerId = null;
    let peers = new Map();
    let lastNetworkSync = 0;

    try {
      const cachedName = localStorage.getItem("pilot_callsign");
      if (cachedName) nameInput.value = cachedName;
    } catch (e) {}

    function connectMultiplayer() {
      if (socket && socket.readyState <= 1) return;

      const wsProtocol = API_BASE_URL.startsWith("https") ? "wss://" : "ws://";
      const cleanHost = API_BASE_URL.replace(/^https?:\/\//, '');
      const playerName = encodeURIComponent(nameInput.value.trim() || 'Pilot');
      const wsUrl = `${wsProtocol}${cleanHost}/api/room?name=${playerName}`;

      try {
        socket = new WebSocket(wsUrl);

        socket.onmessage = (event) => {
          try {
            const data = JSON.parse(event.data);
            if (data.type === 'INIT') {
              selfPlayerId = data.selfId;
            } else if (data.type === 'PEERS' && Array.isArray(data.players)) {
              peers.clear();
              for (const p of data.players) {
                if (p.id !== selfPlayerId) {
                  peers.set(p.id, p);
                }
              }
              peerDisplay.innerText = `ONLINE: ${peers.size + 1}`;
            } else if (data.type === 'LEAVE') {
              peers.delete(data.id);
              peerDisplay.innerText = `ONLINE: ${peers.size + 1}`;
            }
          } catch (e) {}
        };

        socket.onclose = () => {
          setTimeout(connectMultiplayer, 3000);
        };
      } catch (err) {}
    }

    connectMultiplayer();

    // Instant Direct Tracking: Cursor or Touch matches paddle center immediately
    function snapPaddle(clientX) {
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const mouseX = (clientX - rect.left) * scaleX;
      player.x = Math.max(0, Math.min(canvas.width - player.w, mouseX - player.w / 2));
    }

    window.addEventListener('mousemove', e => {
      if (state === 'PLAYING') snapPaddle(e.clientX);
    });

    window.addEventListener('touchmove', e => {
      if (state === 'PLAYING' && e.touches.length > 0) {
        snapPaddle(e.touches[0].clientX);
      }
    }, { passive: true });

    function triggerStart(e) {
      if (e) {
        e.preventDefault();
        e.stopPropagation();
      }
      initAudio();
      overlay.style.display = 'none';
      lbOverlay.style.display = 'none';
      
      projectiles = [];
      score = 0;
      player.x = (canvas.width - player.w) / 2;
      spawnTimer = 0;
      pulseGlow = 0;
      state = 'PLAYING';
      scoreDisplay.innerText = "SCORE: 0";
      
      // Spawn gentle initial orb
      projectiles.push({
        x: Math.random() * (canvas.width - 60) + 30,
        y: -10,
        r: 10,
        speed: 1.4
      });

      if (sdkReady && typeof PokiSDK !== 'undefined') {
        try { PokiSDK.gameplayStart(); } catch(err) {}
      }
    }

    function gameOver() {
      state = 'GAMEOVER';
      if (sdkReady && typeof PokiSDK !== 'undefined') {
        try { PokiSDK.gameplayStop(); } catch(err) {}
      }
      playBeep(120, 'sawtooth', 0.4);
      
      showLeaderboard(score);

      if (sdkReady && typeof PokiSDK !== 'undefined') {
        try {
          PokiSDK.commercialBreak(() => {
            isMuted = true;
          }).then(() => {
            isMuted = false;
          });
        } catch(err) {
          isMuted = false;
        }
      }
    }

    actionBtn.addEventListener('click', triggerStart);
    actionBtn.addEventListener('touchstart', triggerStart);

    function update() {
      backgroundOffset = (backgroundOffset + 0.3) % 40;

      if (state !== 'PLAYING') return;

      // Broadcast position over WebSocket
      const now = performance.now();
      if (now - lastNetworkSync > 50) {
        if (socket && socket.readyState === WebSocket.OPEN) {
          socket.send(JSON.stringify({ type: 'POS', x: Math.round(player.x) }));
        }
        lastNetworkSync = now;
      }

      // Gentle spawn cadence: every 75 frames (~1.25 seconds)
      spawnTimer++;
      if (spawnTimer % 75 === 0) {
        projectiles.push({
          x: Math.random() * (canvas.width - 60) + 30,
          y: -15,
          r: 10,
          speed: 1.4 + Math.random() * 0.6 + (score * 0.005)
        });
      }

      const paddleCenter = player.x + player.w / 2;

      for (let i = projectiles.length - 1; i >= 0; i--) {
        const p = projectiles[i];
        p.y += p.speed;

        // Magnetic Attraction: pulls orb towards paddle when entering vicinity
        const distToPaddle = Math.hypot(p.x - paddleCenter, p.y - player.y);
        if (distToPaddle < 70 && p.y < player.y + player.h) {
          p.x += (paddleCenter - p.x) * 0.15; // Smooth gravitational pull
        }

        // Catch Collision Box
        if (p.y + p.r >= player.y && p.y - p.r <= player.y + player.h &&
            p.x + p.r >= player.x && p.x - p.r <= player.x + player.w) {
          projectiles.splice(i, 1);
          score += 10;
          pulseGlow = 1.0;
          scoreDisplay.innerText = "SCORE: " + score;
          playBeep(520, 'sine', 0.12);
          continue;
        }

        // Miss Check
        if (p.y > canvas.height + 25) {
          gameOver();
          break;
        }
      }

      if (pulseGlow > 0) pulseGlow -= 0.05;
    }

    function draw() {
      ctx.fillStyle = '#0b0c10';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Subtle Background Grid
      ctx.strokeStyle = 'rgba(69, 162, 158, 0.1)';
      ctx.lineWidth = 1;
      for (let x = 0; x < canvas.width; x += 40) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, canvas.height);
        ctx.stroke();
      }
      for (let y = backgroundOffset; y < canvas.height; y += 40) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(canvas.width, y);
        ctx.stroke();
      }

      // Draw Connected Peers
      for (const peer of peers.values()) {
        ctx.fillStyle = 'rgba(189, 147, 249, 0.5)';
        ctx.shadowBlur = 8;
        ctx.shadowColor = '#bd93f9';
        ctx.fillRect(peer.x, player.y, player.w, player.h);

        ctx.font = '11px monospace';
        ctx.fillStyle = '#bd93f9';
        ctx.textAlign = 'center';
        ctx.fillText(peer.name, peer.x + (player.w / 2), player.y - 6);
      }

      // Draw Player Paddle with Magnetic Glow
      ctx.fillStyle = '#66fcf1';
      ctx.shadowBlur = 12 + (pulseGlow * 20);
      ctx.shadowColor = pulseGlow > 0 ? '#ffffff' : '#66fcf1';
      ctx.fillRect(player.x, player.y, player.w, player.h);

      // Magnetic Field Visualizer (Subtle Arc)
      ctx.strokeStyle = `rgba(102, 252, 241, ${0.15 + pulseGlow * 0.3})`;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(player.x + player.w / 2, player.y, 65, Math.PI, 0, false);
      ctx.stroke();

      // Draw Energy Droplets
      ctx.fillStyle = '#ff0055';
      ctx.shadowColor = '#ff0055';
      ctx.shadowBlur = 10;
      for (const p of projectiles) {
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.shadowBlur = 0;

      update();
      requestAnimationFrame(draw);
    }

    function setStatus(msg, isError = false) {
      lbStatus.style.color = isError ? "#ff4d4d" : "#66fcf1";
      lbStatus.innerText = msg;
    }

    async function fetchLeaderboard() {
      lbBody.innerHTML = '<tr><td colspan="3" style="text-align:center;">SYNCING...</td></tr>';
      setStatus("");

      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 6000);

      try {
        const res = await fetch(`${API_BASE_URL}/api/scores`, {
          method: "GET",
          signal: controller.signal,
          headers: { "Accept": "application/json" }
        });
        clearTimeout(timeoutId);

        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();

        if (!data.success || !Array.isArray(data.scores)) {
          throw new Error("Malformed response");
        }

        if (data.scores.length === 0) {
          lbBody.innerHTML = '<tr><td colspan="3" style="text-align:center;">NO SCORES YET</td></tr>';
          return;
        }

        lbBody.innerHTML = data.scores.map((row, idx) => `
          <tr>
            <td>${idx + 1}</td>
            <td>${escapeHtml(row.player_name)}</td>
            <td style="text-align: right;">${row.score.toLocaleString()}</td>
          </tr>
        `).join("");

      } catch (err) {
        clearTimeout(timeoutId);
        lbBody.innerHTML = '<tr><td colspan="3" style="text-align:center; color:#ff4d4d;">OFFLINE</td></tr>';
        setStatus("Leaderboard server offline", true);
      }
    }

    async function submitScore() {
      const name = nameInput.value.trim();
      if (!name) {
        setStatus("Enter a callsign", true);
        nameInput.focus();
        return;
      }

      try {
        localStorage.setItem("pilot_callsign", name);
      } catch (e) {}

      submitBtn.disabled = true;
      nameInput.disabled = true;
      setStatus("Transmitting record...");

      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 6000);

      try {
        const res = await fetch(`${API_BASE_URL}/api/scores`, {
          method: "POST",
          signal: controller.signal,
          headers: {
            "Content-Type": "application/json",
            "Accept": "application/json"
          },
          body: JSON.stringify({
            player_name: name,
            score: lastGameScore
          })
        });
        clearTimeout(timeoutId);

        const data = await res.json();
        if (!res.ok || !data.success) {
          throw new Error(data.error || "Failed");
        }

        setStatus("Score recorded");
        submitSection.style.display = "none";
        await fetchLeaderboard();

      } catch (err) {
        clearTimeout(timeoutId);
        setStatus("Submission failed", true);
        submitBtn.disabled = false;
        nameInput.disabled = false;
      }
    }

    function escapeHtml(str) {
      return str.replace(/[&<>'"]/g, tag => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        "'": "&#39;",
        '"': "&quot;"
      }[tag] || tag));
    }

    function showLeaderboard(currentScore = null) {
      if (currentScore !== null) {
        lastGameScore = currentScore;
        submitSection.style.display = "flex";
        submitBtn.disabled = false;
        nameInput.disabled = false;
      } else {
        submitSection.style.display = "none";
      }

      lbOverlay.style.display = "flex";
      fetchLeaderboard();
    }

    function hideLeaderboard() {
      lbOverlay.style.display = "none";
      overlayTitle.innerText = "DEFLECTOR OFFLINE";
      overlayDesc.innerText = "Final Energy Absorbed: " + score;
      actionBtn.innerText = "RETRY";
      overlay.style.display = "flex";
    }

    submitBtn.addEventListener("click", submitScore);
    nameInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") submitScore();
    });
    closeBtn.addEventListener("click", hideLeaderboard);

    requestAnimationFrame(draw);
  </script>
</body>
</html>
